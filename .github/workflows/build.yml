name: Build NetHunter Kernel (mi439)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Pre-fetch clang toolchain
        run: |
          # kramel.sh 会从 android.googlesource.com 下载 clang-r416183b，
          # 但该文件已被移除（404）。这里改用 GitHub 镜像提前准备好，
          # 脚本检测到 clang 目录存在就会跳过下载。
          git clone --depth=1 \
            https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b \
            -b 11.0 clang
          ./clang/bin/clang --version

      - name: Workaround CI environment
        run: |
          echo "DRONE_BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          echo "DRONE_SYSTEM_HOST=github-actions" >> $GITHUB_ENV

      - name: Build kernel
        env:
          ci: 1
          TGI: 0
          version: ${{ github.run_number }}
        run: |
          bash kramel.sh img mod mkzip

      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetErnels-kernel-zip
          path: anykernel3-mi439/*.zip
          if-no-files-found: warn

      - name: Upload modules zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetErnels-modules-zip
          path: modules/*.zip
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: log.txt
          if-no-files-found: ignore
